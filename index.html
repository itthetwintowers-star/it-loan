<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IT Equipment Loan System</title>
<meta name="description" content="ระบบยืมอุปกรณ์ไอที">
<meta name="theme-color" id="themeColorMeta" content="#1a237e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IT Loan">
<link rel="manifest" id="pwaManifest" href="">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== THEME VARIABLES ===== */
  :root {
    --primary: #1a237e; --primary-light: #283593;
    --accent: #00bcd4; --accent2: #ff6f00;
    --success: #00897b; --danger: #c62828; --warn: #f57f17;
    --bg: #f0f4f8; --card: #ffffff;
    --text: #1a1a2e; --text2: #546e7a; --border: #e0e7ef;
    --sidebar-w: 240px; --header-h: 60px;
    --radius: 12px;
    --shadow: 0 2px 16px rgba(26,35,126,0.10);
    --shadow-lg: 0 8px 32px rgba(26,35,126,0.16);
    --overlay: rgba(0,0,0,0.45);
    --input-bg: #fafbfd;
    --cal-cell-bg: #fff;
  }
  [data-theme="dark"] {
    --primary: #5c6bc0; --primary-light: #7986cb;
    --accent: #00bcd4;
    --bg: #0f1117; --card: #1a1d27;
    --text: #e8eaf6; --text2: #90a4ae; --border: #2a2d3a;
    --shadow: 0 2px 16px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
    --overlay: rgba(0,0,0,0.65);
    --input-bg: #22253a;
    --cal-cell-bg: #1e2130;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }

  /* ===== LOGIN ===== */
  #loginPage {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a237e 0%, #0d47a1 40%, #00bcd4 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; padding: 16px;
  }
  [data-theme="dark"] #loginPage {
    background: linear-gradient(135deg, #0d1033 0%, #1a237e 60%, #006064 100%);
  }
  #loginPage::before { content:''; position:absolute; width:600px; height:600px; border-radius:50%; background:rgba(255,255,255,0.05); top:-150px; right:-150px; }
  #loginPage::after  { content:''; position:absolute; width:400px; height:400px; border-radius:50%; background:rgba(255,255,255,0.04); bottom:-100px; left:-100px; }
  .login-card {
    background: var(--card); border-radius: 20px; padding: 40px 36px 36px;
    width: 100%; max-width: 400px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.25);
    position: relative; z-index: 1;
    animation: slideUp 0.5s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(32px); } to { opacity:1; transform:none; } }
  .login-logo { text-align:center; margin-bottom:28px; }
  .login-logo .icon { font-size:48px; margin-bottom:8px; display:block; }
  .login-logo h1 { font-family:'Kanit',sans-serif; font-size:1.4rem; font-weight:700; color:var(--primary); }
  .login-logo p { font-size:0.85rem; color:var(--text2); }

  /* ===== FORMS ===== */
  .form-group { margin-bottom: 16px; }
  .form-group label { display:block; font-size:0.85rem; font-weight:600; color:var(--text2); margin-bottom:6px; }
  .form-group input, .form-group select, .form-group textarea {
    width:100%; padding:11px 14px; border:1.5px solid var(--border);
    border-radius:8px; font-family:'Sarabun',sans-serif; font-size:0.95rem;
    transition:border 0.2s,box-shadow 0.2s; background:var(--input-bg); color:var(--text);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,188,212,0.15); background:var(--card);
  }

  /* ===== BUTTONS ===== */
  .btn {
    display:inline-flex; align-items:center; gap:7px;
    padding:10px 20px; border-radius:8px; border:none;
    font-family:'Sarabun',sans-serif; font-size:0.95rem; font-weight:600;
    cursor:pointer; transition:all 0.18s; text-decoration:none; white-space:nowrap;
  }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:var(--primary-light); transform:translateY(-1px); box-shadow:0 4px 12px rgba(26,35,126,0.3); }
  .btn-accent  { background:var(--accent); color:#fff; }
  .btn-accent:hover  { background:#00acc1; transform:translateY(-1px); }
  .btn-success { background:var(--success); color:#fff; }
  .btn-success:hover { background:#00796b; }
  .btn-danger  { background:var(--danger); color:#fff; }
  .btn-danger:hover  { background:#b71c1c; }
  .btn-warn    { background:var(--warn); color:#fff; }
  .btn-warn:hover    { background:#e65100; }
  .btn-ghost   { background:transparent; color:var(--text2); border:1.5px solid var(--border); }
  .btn-ghost:hover   { background:var(--bg); color:var(--text); }
  .btn-full    { width:100%; justify-content:center; padding:12px; font-size:1rem; }
  .btn-sm      { padding:6px 14px; font-size:0.82rem; border-radius:6px; }
  .btn-icon    { width:38px; height:38px; padding:0; justify-content:center; border-radius:10px; font-size:1.1rem; }

  /* ===== SIDEBAR OVERLAY (mobile) ===== */
  #sidebarOverlay {
    display:none; position:fixed; inset:0; background:var(--overlay); z-index:90;
  }
  #sidebarOverlay.open { display:block; }

  /* ===== LAYOUT ===== */
  #app { display:none; min-height:100vh; }
  #app.visible { display:flex; }
  .sidebar {
    width:var(--sidebar-w); background:var(--primary);
    display:flex; flex-direction:column;
    position:fixed; top:0; left:0; bottom:0; z-index:100;
    transition:transform 0.28s cubic-bezier(.4,0,.2,1), box-shadow 0.28s;
    will-change:transform;
  }
  .sidebar-logo {
    padding:20px 16px 16px; border-bottom:1px solid rgba(255,255,255,0.1);
    display:flex; align-items:center; gap:10px;
  }
  .sidebar-logo .logo-icon { font-size:28px; }
  .sidebar-logo .logo-text h2 { font-family:'Kanit',sans-serif; font-size:1rem; color:#fff; font-weight:700; line-height:1.2; }
  .sidebar-logo .logo-text p  { font-size:0.72rem; color:rgba(255,255,255,0.55); }
  .sidebar-user {
    padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.1);
    display:flex; align-items:center; gap:10px;
  }
  .user-avatar {
    width:36px; height:36px; border-radius:50%;
    background:var(--accent); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:0.85rem; color:#fff; flex-shrink:0;
  }
  .user-info .name { font-size:0.88rem; font-weight:600; color:#fff; }
  .user-info .role { font-size:0.72rem; color:rgba(255,255,255,0.55); }
  .nav-menu { flex:1; padding:12px 0; overflow-y:auto; }
  .nav-item {
    display:flex; align-items:center; gap:11px;
    padding:11px 20px; cursor:pointer; transition:all 0.18s;
    border-left:3px solid transparent; color:rgba(255,255,255,0.7);
    font-size:0.9rem; font-weight:500;
  }
  .nav-item:hover  { background:rgba(255,255,255,0.08); color:#fff; }
  .nav-item.active { background:rgba(0,188,212,0.18); color:#fff; border-left-color:var(--accent); }
  .nav-item .nav-icon { font-size:1.1rem; width:22px; text-align:center; }
  .sidebar-footer { padding:16px; border-top:1px solid rgba(255,255,255,0.1); }

  /* ===== MAIN ===== */
  .main-content { margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; min-height:100vh; }
  .topbar {
    height:var(--header-h); background:var(--card); border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 20px;
    position:sticky; top:0; z-index:50;
    box-shadow:0 1px 4px rgba(0,0,0,0.06);
    gap:12px;
  }
  .topbar-menu-btn {
    display:none; background:none; border:none; cursor:pointer;
    font-size:1.4rem; color:var(--text2); padding:4px; border-radius:6px; flex-shrink:0;
  }
  .topbar-title { font-family:'Kanit',sans-serif; font-size:1.05rem; font-weight:600; color:var(--primary); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar-controls { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .page-content { padding:20px; flex:1; }

  /* ===== DARK MODE TOGGLE ===== */
  .dark-toggle {
    width:44px; height:24px; border-radius:12px; border:none; cursor:pointer;
    background:var(--border); position:relative; transition:background 0.3s; flex-shrink:0;
    display:flex; align-items:center;
  }
  .dark-toggle::after {
    content:''; position:absolute; left:3px;
    width:18px; height:18px; border-radius:50%; background:#fff;
    transition:transform 0.3s, background 0.3s;
    box-shadow:0 1px 4px rgba(0,0,0,0.2);
  }
  [data-theme="dark"] .dark-toggle { background:var(--accent); }
  [data-theme="dark"] .dark-toggle::after { transform:translateX(20px); }
  .dark-toggle-wrap { display:flex; align-items:center; gap:6px; font-size:0.8rem; color:var(--text2); }

  /* ===== INSTALL PWA BUTTON ===== */
  #installBtn {
    display:none; /* shown when beforeinstallprompt fires */
  }

  /* ===== CARDS ===== */
  .card { background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:20px; }
  .card-title { font-family:'Kanit',sans-serif; font-size:1rem; font-weight:600; color:var(--primary); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:20px; }
  .stat-card {
    background:var(--card); border-radius:var(--radius); padding:18px 16px;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:14px;
    border-left:4px solid var(--accent); transition:transform 0.18s,box-shadow 0.18s;
  }
  .stat-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
  .stat-card.s1 { border-left-color:#1a237e; }
  .stat-card.s2 { border-left-color:#00bcd4; }
  .stat-card.s3 { border-left-color:#ff6f00; }
  .stat-card.s4 { border-left-color:#00897b; }
  [data-theme="dark"] .stat-card.s1 { border-left-color:#7986cb; }
  .stat-icon { font-size:2rem; flex-shrink:0; }
  .stat-val   { font-family:'Kanit',sans-serif; font-size:1.6rem; font-weight:700; color:var(--text); line-height:1; }
  .stat-label { font-size:0.8rem; color:var(--text2); margin-top:2px; }

  /* ===== TABLE ===== */
  .table-wrap { overflow-x:auto; border-radius:8px; -webkit-overflow-scrolling:touch; }
  table { width:100%; border-collapse:collapse; font-size:0.88rem; }
  thead tr { background:var(--bg); }
  thead th { padding:11px 14px; text-align:left; font-weight:600; color:var(--text2); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; }
  tbody tr { border-bottom:1px solid var(--border); transition:background 0.12s; }
  tbody tr:hover { background:var(--bg); }
  tbody td { padding:11px 14px; vertical-align:middle; }
  tbody tr:last-child { border-bottom:none; }

  /* ===== BADGE ===== */
  .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:0.75rem; font-weight:600; }
  .badge-success { background:#e8f5e9; color:#2e7d32; }
  .badge-danger  { background:#ffebee; color:#c62828; }
  .badge-warn    { background:#fff8e1; color:#f57f17; }
  .badge-info    { background:#e3f2fd; color:#1565c0; }
  .badge-gray    { background:#eceff1; color:#546e7a; }
  .badge-accent  { background:#e0f7fa; color:#006064; }
  [data-theme="dark"] .badge-success { background:#1b5e2040; color:#69f0ae; }
  [data-theme="dark"] .badge-danger  { background:#b71c1c40; color:#ef9a9a; }
  [data-theme="dark"] .badge-warn    { background:#e65100' '40; color:#ffcc02; }
  [data-theme="dark"] .badge-info    { background:#0d47a140; color:#82b1ff; }
  [data-theme="dark"] .badge-gray    { background:#37474f40; color:#b0bec5; }
  [data-theme="dark"] .badge-accent  { background:#006064' '40; color:#80deea; }

  /* ===== MODAL ===== */
  .modal-overlay {
    position:fixed; inset:0; background:var(--overlay);
    display:none; align-items:center; justify-content:center; z-index:200;
    backdrop-filter:blur(3px); padding:16px;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:var(--card); border-radius:16px; padding:24px;
    width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
    box-shadow:0 24px 64px rgba(0,0,0,0.3);
    animation:modalIn 0.22s ease;
  }
  @keyframes modalIn { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:none; } }
  .modal-title { font-family:'Kanit',sans-serif; font-size:1.1rem; font-weight:700; color:var(--primary); margin-bottom:20px; display:flex; align-items:center; gap:8px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; flex-wrap:wrap; }

  /* ===== CALENDAR ===== */
  .cal-grid   { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-header { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:4px; }
  .cal-day-name { text-align:center; font-size:0.75rem; font-weight:700; color:var(--text2); padding:5px 0; }
  .cal-cell {
    border:1.5px solid var(--border); border-radius:8px; min-height:66px;
    padding:5px; font-size:0.78rem; background:var(--cal-cell-bg); cursor:pointer;
    transition:all 0.15s; position:relative;
  }
  .cal-cell:hover { border-color:var(--accent); background:var(--bg); }
  .cal-cell.today { border-color:var(--primary); background:var(--bg); }
  .cal-cell.other-month { opacity:0.4; }
  .cal-num { font-weight:600; color:var(--text); display:block; }
  .cal-cell.today .cal-num { color:var(--primary); }
  .cal-event { background:var(--accent); color:#fff; border-radius:4px; padding:1px 4px; font-size:0.68rem; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-event-pending { background:var(--warn); }
  .cal-nav { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .cal-nav h3 { font-family:'Kanit',sans-serif; font-size:1rem; font-weight:600; flex:1; text-align:center; color:var(--text); }
  .cal-btn { background:none; border:1.5px solid var(--border); border-radius:8px; padding:5px 11px; cursor:pointer; font-size:1rem; transition:all 0.15s; color:var(--text); }
  .cal-btn:hover { background:var(--primary); color:#fff; border-color:var(--primary); }

  /* ===== DEPT SELECT ===== */
  .dept-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
  .dept-btn {
    padding:12px 8px; border:2px solid var(--border); border-radius:10px;
    background:var(--card); cursor:pointer; text-align:center;
    font-family:'Sarabun',sans-serif; font-size:0.82rem; font-weight:600; color:var(--text);
    transition:all 0.15s;
  }
  .dept-btn:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,188,212,0.15); }
  .dept-btn.selected { border-color:var(--primary); background:var(--primary); color:#fff; }
  .dept-icon { font-size:1.4rem; display:block; margin-bottom:6px; }

  /* ===== TOAST ===== */
  #toast {
    position:fixed; bottom:24px; right:20px; z-index:999;
    background:#1a1a2e; color:#fff; padding:12px 20px;
    border-radius:10px; font-size:0.9rem; font-weight:500; max-width:320px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    opacity:0; transform:translateY(12px);
    transition:all 0.25s; pointer-events:none;
  }
  [data-theme="dark"] #toast { background:var(--card); border:1px solid var(--border); }
  #toast.show { opacity:1; transform:none; }

  /* ===== MISC ===== */
  .loading-spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin 0.6s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .empty-state { text-align:center; padding:40px 20px; color:var(--text2); }
  .empty-state .empty-icon { font-size:3rem; margin-bottom:12px; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .section-header h2 { font-family:'Kanit',sans-serif; font-size:1.1rem; font-weight:700; color:var(--primary); }
  .filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .filters input, .filters select { padding:8px 12px; border:1.5px solid var(--border); border-radius:8px; font-family:'Sarabun',sans-serif; font-size:0.88rem; background:var(--input-bg); color:var(--text); }
  .filters input:focus, .filters select:focus { outline:none; border-color:var(--accent); }
  hr { border:none; border-top:1px solid var(--border); margin:16px 0; }
  .text-sm { font-size:0.82rem; }
  .text-muted { color:var(--text2); }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .tag { display:inline-block; background:#e8eaf6; color:#3949ab; border-radius:6px; padding:2px 8px; font-size:0.75rem; font-weight:600; margin-right:4px; }
  [data-theme="dark"] .tag { background:#3949ab40; color:#9fa8da; }
  code { background:var(--bg); padding:2px 6px; border-radius:4px; font-size:0.85rem; }

  /* ===== MOBILE ===== */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
      box-shadow: none;
    }
    .sidebar.open {
      transform: translateX(0);
      box-shadow: 4px 0 24px rgba(0,0,0,0.25);
    }
    .main-content { margin-left: 0; }
    .topbar-menu-btn { display: flex; }
    .form-row { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: 1fr 1fr; gap:10px; }
    .page-content { padding: 14px; }
    .topbar { padding: 0 14px; }
    .dept-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:8px; }
    .cal-cell { min-height: 48px; padding: 4px 3px; }
    .cal-num { font-size: 0.75rem; }
    .cal-event { font-size: 0.62rem; padding: 1px 3px; }
    .modal-actions { justify-content: stretch; }
    .modal-actions .btn { flex: 1; justify-content: center; }
    .filters { gap: 8px; }
    .filters input, .filters select { flex: 1; min-width: 120px; }
    #toast { left: 16px; right: 16px; bottom: 16px; max-width: 100%; }
    .card { padding: 14px; }
  }
  @media (max-width: 480px) {
    .stat-grid { grid-template-columns: 1fr 1fr; }
    .stat-val { font-size: 1.3rem; }
    .login-card { padding: 32px 20px 28px; }
    .section-header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- ===== LOGIN PAGE ===== -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <span class="icon">💻</span>
      <h1>ระบบยืมอุปกรณ์ IT</h1>
      <p>IT Equipment Loan Management System</p>
    </div>
    <div id="deptSelectSection" style="display:none">
      <p style="font-size:0.85rem;color:var(--text2);margin-bottom:12px;font-weight:600;">เลือกแผนก / Select Department</p>
      <div class="dept-grid" id="deptGrid"></div>
      <button class="btn btn-ghost" onclick="showLoginForm()" style="margin-top:8px;">← กลับ</button>
    </div>
    <div id="loginForm">
      <div class="form-group">
        <label>ชื่อผู้ใช้ (Username)</label>
        <input type="text" id="loginUser" placeholder="admin / user / it" value="">
      </div>
      <div class="form-group">
        <label>รหัสผ่าน (Password)</label>
        <input type="password" id="loginPass" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <label style="font-size:0.85rem;font-weight:600;color:var(--text2)">🔗 Google Apps Script URL</label>
          <button onclick="toggleGasInput()" style="font-size:0.75rem;color:var(--accent);background:none;border:none;cursor:pointer;font-family:Sarabun,sans-serif" id="gasToggleBtn">ตั้งค่า</button>
        </div>
        <div id="gasInputWrap" style="display:none">

// ==================== CONFIG ====================
const SHEET_ID = '1KjjWgA9YEAuoykD2p8Xr9_UYP7gfvEJkEUL2hnVx20U';
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbydtWX0j4UBFGdHbtV-J4gJJF9UzJj8kFqCvM9yqcVRFv8ABh7mP3TxV1lzz0bqrol6/exec';

let state = {

  calYear: new Date().getFullYear(),

// ==================== LOCAL FALLBACK DATA (ใช้เฉพาะเมื่อ GAS ไม่ตอบสนอง) ====================
// ไม่มี demo data — ข้อมูลทั้งหมดมาจาก Google Sheet เท่านั้น

// ==================== GOOGLE APPS SCRIPT API ====================
// GAS รับผ่าน GET + payload เป็น base64 JSON เพื่อหลีก CORS preflight
async function gasRequest(action, payload = {}) {
  if (!GAS_URL) return simulateGAS(action, payload);
  try {
    const body = JSON.stringify({ action, ...payload });
    // ใช้ GET + query param เพื่อหลีก CORS issue
    const url = GAS_URL + '?payload=' + encodeURIComponent(body);
    const res = await fetch(url, { method: 'GET', redirect: 'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    return json;
  } catch (err) {
    console.warn('GAS fetch failed, using demo mode:', err.message);
    showToast('⚠️ ไม่สามารถเชื่อม Google Sheet ได้: ' + err.message);
    return simulateGAS(action, payload);
  }
}

function simulateGAS(action, payload) {
  // Fallback เมื่อ GAS ไม่ตอบสนอง — ทำงานกับ state ใน memory
  switch (action) {
    case 'login':
      return { success: false, message: 'ไม่สามารถเชื่อม Google Sheet ได้ กรุณาตรวจสอบ GAS URL' };
    case 'getEquipment':
      return { success: true, data: state.equipment };
    case 'addEquipment': {
      const eq = { id: 'AST-' + Date.now(), ...payload.data };
      state.equipment.push(eq);
      return { success: true, data: eq };
    }
    case 'updateEquipment': {
      const i = state.equipment.findIndex(e => String(e.id||'').trim() === String(payload.id).trim());
      if (i >= 0) state.equipment[i] = { ...state.equipment[i], ...payload.data };
      return { success: true };
    }
    case 'deleteEquipment': {
      state.equipment = state.equipment.filter(e => String(e.id||'').trim() !== String(payload.id).trim());
      return { success: true };
    }
    case 'getRequests':
      return { success: true, data: state.requests };
    case 'addRequest': {
      const req = { id: 'REQ-' + Date.now(), ...payload.data, status: 'รออนุมัติ', handledBy: '' };
      state.requests.push(req);
      return { success: true, data: req };
    }
    case 'updateRequest': {
      const i = state.requests.findIndex(r => String(r.id||'').trim() === String(payload.id).trim());
      if (i >= 0) state.requests[i] = { ...state.requests[i], ...payload.data };
      return { success: true };
    }
    case 'getUsers':
      return { success: true, data: state.users.map(u => ({ ...u, password: '****' })) };
    case 'addUser': {
      state.users.push(payload.data);
      return { success: true };
    }
    case 'deleteUser': {
      state.users = state.users.filter(u => u.username !== payload.username);
      return { success: true };
    }
    case 'changePassword': {
      const u = state.users.find(x => x.username === payload.username);
      if (u) u.password = payload.newPassword;
      return { success: true };
    }
    case 'editRequest': {
      const i = state.requests.findIndex(r => String(r.id||'').trim() === String(payload.id).trim());
      if (i >= 0) state.requests[i] = { ...state.requests[i], ...payload.data,
        equipment: payload.data.equipment, startdate: payload.data.startDate,
        enddate: payload.data.endDate, days: payload.data.days, hours: payload.data.hours, note: payload.data.note };
      return { success: true };
    }
    default:
      return { success: false, message: 'Unknown action: ' + action };
  }
}

// ==================== INIT DATA (ล้าง demo — ใช้ข้อมูลจาก Sheet เท่านั้น) ====================

  state.equipment = [];

// ==================== SESSION TIMEOUT ====================
const SESSION = {
  IDLE_MS:    30 * 60 * 1000,  // 30 นาที ไม่มีการใช้งาน → logout
  WARN_MS:    25 * 60 * 1000,  // แจ้งเตือน 5 นาทีก่อน logout
  _idleTimer:  null,
  _warnTimer:  null,
  _warnShown:  false,
  _countdownInterval: null,
};

function sessionStart() {
  sessionReset();
  // ฟัง user activity
  ['click','keydown','touchstart','mousemove','scroll'].forEach(evt => {
    document.addEventListener(evt, sessionReset, { passive: true });
  });
}

function sessionStop() {
  clearTimeout(SESSION._idleTimer);
  clearTimeout(SESSION._warnTimer);
  clearInterval(SESSION._countdownInterval);
  SESSION._warnShown = false;
  ['click','keydown','touchstart','mousemove','scroll'].forEach(evt => {
    document.removeEventListener(evt, sessionReset);
  });
}

function sessionReset() {
  clearTimeout(SESSION._idleTimer);
  clearTimeout(SESSION._warnTimer);
  clearInterval(SESSION._countdownInterval);

  // ปิด warning ถ้ากำลังแสดงอยู่
  if (SESSION._warnShown) {
    SESSION._warnShown = false;
    const modal = document.getElementById('sessionWarnModal');
    if (modal) modal.remove();
  }

  // ตั้ง warning timer (25 นาที)
  SESSION._warnTimer = setTimeout(() => showSessionWarning(), SESSION.WARN_MS);
  // ตั้ง logout timer (30 นาที)
  SESSION._idleTimer = setTimeout(() => sessionLogout(), SESSION.IDLE_MS);
}

function showSessionWarning() {
  if (SESSION._warnShown) return;
  SESSION._warnShown = true;
  let secs = 5 * 60; // 5 นาที countdown

  // สร้าง modal แจ้งเตือน
  const div = document.createElement('div');
  div.id = 'sessionWarnModal';
  div.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(3px)';
  div.innerHTML = `
    <div style="background:var(--card);border-radius:16px;padding:32px 28px;max-width:380px;width:90%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,0.3)">
      <div style="font-size:3rem;margin-bottom:12px">⏰</div>
      <div style="font-family:Kanit,sans-serif;font-size:1.15rem;font-weight:700;color:var(--text);margin-bottom:8px">
        เซสชันใกล้หมดอายุ
      </div>
      <div style="color:var(--text2);font-size:0.9rem;margin-bottom:20px">
        ไม่มีการใช้งาน — ระบบจะ logout อัตโนมัติใน
      </div>
      <div id="sessionCountdown" style="font-family:Kanit,sans-serif;font-size:2.5rem;font-weight:700;color:var(--danger);margin-bottom:24px">
        5:00
      </div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button onclick="sessionReset()" class="btn btn-primary" style="min-width:140px;justify-content:center">
          ✅ ยังอยู่ในระบบ
        </button>
        <button onclick="sessionLogout()" class="btn btn-ghost">
          🚪 Logout
        </button>
      </div>
    </div>`;
  document.body.appendChild(div);

  // countdown
  SESSION._countdownInterval = setInterval(() => {
    secs--;
    const el = document.getElementById('sessionCountdown');
    if (el) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      el.textContent = m + ':' + String(s).padStart(2,'0');
      if (secs <= 60) el.style.color = 'var(--danger)';
    }
    if (secs <= 0) {
      clearInterval(SESSION._countdownInterval);
      sessionLogout();
    }
  }, 1000);
}

function sessionLogout() {
  sessionStop();
  const modal = document.getElementById('sessionWarnModal');
  if (modal) modal.remove();
  showToast('⏰ หมดเวลาเซสชัน — กรุณา Login ใหม่');
  setTimeout(() => logout(), 1200);
}

function getSessionTimeLeft() {
  // คืน string แสดงเวลาที่เหลือ (สำหรับ debug)
  return 'Active';
}
const RATE_LIMIT = { maxRequests: 3, windowMs: 60 * 60 * 1000 }; // 3 ครั้ง / ชั่วโมง

function checkRateLimit(username) {
  const key = 'rl_' + username;
  const now = Date.now();
  let data = JSON.parse(localStorage.getItem(key) || '{"count":0,"window":0}');
  // Reset ถ้าหน้าต่างเวลาผ่านไปแล้ว
  if (now - data.window > RATE_LIMIT.windowMs) {
    data = { count: 0, window: now };
  }
  if (data.count >= RATE_LIMIT.maxRequests) {
    const remaining = Math.ceil((RATE_LIMIT.windowMs - (now - data.window)) / 60000);
    return { allowed: false, remaining, count: data.count };
  }
  data.count++;
  localStorage.setItem(key, JSON.stringify(data));
  return { allowed: true, remaining: 0, count: data.count };
}

function getRateLimitStatus(username) {
  const key = 'rl_' + username;
  const now = Date.now();
  const data = JSON.parse(localStorage.getItem(key) || '{"count":0,"window":0}');
  if (now - data.window > RATE_LIMIT.windowMs) return { count: 0, max: RATE_LIMIT.maxRequests };
  return { count: data.count, max: RATE_LIMIT.maxRequests };
}

// ==================== DATETIME PARSER (รองรับทุก format จาก GAS) ====================
// GAS อาจส่ง: "2026-05-19 1:42", "2026-05-19T01:42", "2026-05-19 14:00", "2026-05-19"
function parseDT(raw) {
  if (!raw || raw === '-') return null;
  const s = String(raw).trim();
  if (!s) return null;
  // Parse โดยตรง — ไม่ผ่าน new Date() เพื่อหลีก UTC offset
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[T ](\d{1,2}):(\d{2})/);
  if (m) {
    return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]),
                    parseInt(m[4]), parseInt(m[5]), 0);
  }
  // วันเดียว
  const d = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (d) return new Date(parseInt(d[1]), parseInt(d[2])-1, parseInt(d[3]));
  return null;
}

// fmtDT สำหรับแสดงผลใน HTML (Thai date)
function fmtDT(raw) {
  if (!raw || raw === '-') return '-';
  const s = String(raw).trim();
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[T ](\d{1,2}):(\d{2})/);
  if (m) {
    const day  = String(m[3]).padStart(2,'0');
    const mon  = String(m[2]).padStart(2,'0');
    const year = parseInt(m[1]) + 543;
    const hr   = String(m[4]).padStart(2,'0');
    const min  = m[5];
    return `${day}/${mon}/${year} ${hr}:${min} น.`;
  }
  // วันเดียว
  const d2 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (d2) return `${String(d2[3]).padStart(2,'0')}/${String(d2[2]).padStart(2,'0')}/${parseInt(d2[1])+543}`;
  try {
    const d = new Date(s);
    if (!isNaN(d)) {
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} น.`;
    }
  } catch(e) {}
  return s;
}

function renderDashboard() {
  const total = state.equipment.length;
  const today = new Date();
  today.setHours(0, 0, 0, 0); // เปรียบเทียบระดับวัน

  // อุปกรณ์ "ถูกยืมอยู่" = request อนุมัติ ที่ enddate >= วันนี้ (ยังไม่คืน)
  const activeBorrowedEq = new Set();
  state.requests.forEach(r => {
    const s = (r.status || '').trim();
    if (s !== 'อนุมัติ') return;
    const endDt = parseDT(r.enddate || r.endDate || '');
    if (!endDt) return;
    const endDay = new Date(endDt.getFullYear(), endDt.getMonth(), endDt.getDate());
    if (endDay >= today) {
      activeBorrowedEq.add((r.equipment || '').trim());
    }
  });
  const borrowed  = activeBorrowedEq.size;
  const available = Math.max(0, total - borrowed);
  const pending   = state.requests.filter(r => (r.status||'') === 'รออนุมัติ').length;

  // ---- สถิติ ----
  // 1. อุปกรณ์ถูกยืมบ่อยที่สุด (นับเฉพาะ อนุมัติ+คืนแล้ว)
  const eqCount = {};
  state.requests.forEach(r => {
    const s  = r.status || '';
    const eq = (r.equipment || '').trim();
    if (!eq || s === 'ปฏิเสธ') return;
    eqCount[eq] = (eqCount[eq] || 0) + 1;

  const topEq  = Object.entries(eqCount).sort((a,b) => b[1]-a[1]).slice(0, 6);

function renderCalendarHTML() {
  const now = new Date();
  const year = state.calYear, month = state.calMonth;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthNames = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const dayNames = ['อา','จ','อ','พ','พฤ','ศ','ส'];

  // Map events by date — รองรับ lowercase keys จาก GAS
  const eventMap = {};
  state.requests
    .filter(r => { const s = r.status||''; return s === 'อนุมัติ' || s === 'รออนุมัติ'; })
    .forEach(r => {
      const rawStart = r.startdate || r.startDate || '';
      const rawEnd   = r.enddate   || r.endDate   || rawStart;
      if (!rawStart) return;
      const dStart = new Date(rawStart);
      const dEnd   = new Date(rawEnd);
      if (isNaN(dStart)) return;
      // ใส่ทุกวันในช่วง start→end
      const cur = new Date(dStart.getFullYear(), dStart.getMonth(), dStart.getDate());
      const fin = new Date(dEnd.getFullYear(),   dEnd.getMonth(),   dEnd.getDate());
      while (cur <= fin) {
        const key = cur.getFullYear()+'-'+(cur.getMonth()+1)+'-'+cur.getDate();
        if (!eventMap[key]) eventMap[key] = [];
        eventMap[key].push(r);
        cur.setDate(cur.getDate() + 1);
      }
    });

  let cells = '';
  for (let i = 0; i < firstDay; i++) {
    const prevDate = new Date(year, month, -firstDay + i + 1);
    cells += '<div class="cal-cell other-month"><span class="cal-num">'+prevDate.getDate()+'</span></div>';
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = now.getDate() === d && now.getMonth() === month && now.getFullYear() === year;
    const key = year+'-'+(month+1)+'-'+d;
    const evs = eventMap[key] || [];
    const evHTML = evs.slice(0,2).map(e => {
      const isPending = (e.status||'') === 'รออนุมัติ';
      const nm = (e.equipment||'').split(' ')[0] || '?';
      const who = e.requester || '?';
      return '<div class="cal-event'+(isPending?' cal-event-pending':'')+'" title="'+who+': '+(e.equipment||'')+'">'+nm+'</div>';
    }).join('');
    const moreHTML = evs.length > 2 ? '<div style="font-size:0.7rem;color:var(--accent);margin-top:2px">+'+(evs.length-2)+' อื่น</div>' : '';
    cells += '<div class="cal-cell '+(isToday?'today':'')+'" onclick="showDayEvents('+d+')">'
           + '<span class="cal-num">'+d+'</span>'
           + evHTML + moreHTML
           + '</div>';
  }
  const remaining = 42 - firstDay - daysInMonth;
  for (let d = 1; d <= remaining; d++) {
    cells += '<div class="cal-cell other-month"><span class="cal-num">'+d+'</span></div>';
  }

  return '<div class="cal-nav">'
       + '<button class="cal-btn" id="calPrev">◀</button>'
       + '<h3>'+monthNames[month]+' '+(year+543)+'</h3>'
       + '<button class="cal-btn" id="calNext">▶</button>'
       + '</div>'
       + '<div class="cal-header">'+dayNames.map(n=>'<div class="cal-day-name">'+n+'</div>').join('')+'</div>'
       + '<div class="cal-grid">'+cells+'</div>';
}

function attachCalendarEvents() {
  document.getElementById('calPrev')?.addEventListener('click', () => {
    state.calMonth--;
    if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    renderDashboard();
  });
  document.getElementById('calNext')?.addEventListener('click', () => {
    state.calMonth++;
    if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    renderDashboard();
  });
}

function showDayEvents(day) {
  const target = new Date(state.calYear, state.calMonth, day);
  const evs = state.requests.filter(r => {
    const rawStart = r.startdate || r.startDate || '';
    const rawEnd   = r.enddate   || r.endDate   || rawStart;
    if (!rawStart) return false;
    const dS = new Date(rawStart); if (isNaN(dS)) return false;
    const dE = new Date(rawEnd);   if (isNaN(dE)) return false;
    const s = new Date(dS.getFullYear(), dS.getMonth(), dS.getDate());
    const e = new Date(dE.getFullYear(), dE.getMonth(), dE.getDate());
    return target >= s && target <= e;
  });
  const title = 'รายการวันที่ '+day+'/'+(state.calMonth+1)+'/'+(state.calYear+543);
  const body = evs.length === 0
    ? '<p class="text-muted" style="padding:12px 0">ไม่มีรายการในวันนี้</p>'
    : evs.map(r => {
        const start  = r.startdate  || r.startDate  || '-';
        const end    = r.enddate    || r.endDate    || '-';
        const status = r.status || '-';
        return '<div style="padding:12px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:8px">'
             + '<div style="font-weight:600;margin-bottom:4px">'+(r.requester||'-')
             + ' <span class="badge badge-info" style="margin-left:6px">'+(r.dept||'')+'</span></div>'
             + '<div style="font-size:0.85rem;color:var(--text2);margin-bottom:4px">💻 '+(r.equipment||'-')+'</div>'
             + '<div style="font-size:0.8rem;color:var(--text2);margin-bottom:6px">📅 '+fmtDT(start)+' → '+fmtDT(end)+'</div>'
             + statusBadge(status)
             + '</div>';
      }).join('');
  openModal('📅 '+title, body + '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button></div>');
}

function calcDuration() {
  const start = document.getElementById('borrowStart').value;
  const end = document.getElementById('borrowEnd').value;
  const dispEl = document.getElementById('durationDisplay');
  const txtEl = document.getElementById('durationText');
  if (!start || !end) { dispEl.style.display='none'; return; }
  const ms = new Date(end) - new Date(start);
  if (ms <= 0) { dispEl.style.display=''; txtEl.textContent = '⚠️ วันที่คืนต้องหลังวันที่ยืม'; return; }
  const totalMins = Math.floor(ms / 60000);
  const days = Math.floor(totalMins / 1440);
  const hours = Math.floor((totalMins % 1440) / 60);
  const mins = totalMins % 60;
  let txt = '';
  if (days > 0) txt += `${days} วัน `;
  if (hours > 0) txt += `${hours} ชั่วโมง `;
  if (mins > 0) txt += `${mins} นาที`;
  dispEl.style.display = '';
  txtEl.textContent = txt.trim() || '0 นาที';
}

function selectBorrowDept(id, el) {
  borrowState.dept = id;
  document.querySelectorAll('#borrowDeptGrid .dept-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

async function submitBorrow() {
  const name  = document.getElementById('borrowName').value.trim();
  const eq    = document.getElementById('borrowEq').value;
  const start = document.getElementById('borrowStart').value;
  const end   = document.getElementById('borrowEnd').value;
  const note  = document.getElementById('borrowNote').value.trim();
  const dept  = borrowState.dept ? DEPARTMENTS.find(d=>d.id===borrowState.dept)?.name : '';

  if (!name || !eq || !start || !end || !dept) {
    showToast('⚠️ กรุณากรอกข้อมูลให้ครบ และเลือกแผนก'); return;
  }
  if (new Date(end) <= new Date(start)) {
    showToast('⚠️ วันที่คืนต้องหลังจากวันที่ยืม'); return;
  }

  // ✅ Rate Limiting Check
  const rl = checkRateLimit(state.user.username);
  if (!rl.allowed) {
    openModal('🚫 ส่งใบขอยืมเกินกำหนด', `
      <div style="text-align:center;padding:8px 0 16px">
        <div style="font-size:3rem;margin-bottom:12px">🛡️</div>
        <div style="font-weight:700;font-size:1.1rem;color:var(--danger);margin-bottom:8px">ส่งใบขอยืมเกินจำนวนที่กำหนด</div>
        <div style="color:var(--text2);font-size:0.9rem;margin-bottom:16px">
          คุณส่งใบขอยืมครบ <strong>${RATE_LIMIT.maxRequests} ครั้ง</strong> ต่อชั่วโมงแล้ว<br>
          กรุณารอ <strong>${rl.remaining} นาที</strong> แล้วลองใหม่
        </div>
        <div style="background:var(--bg);border-radius:10px;padding:12px;font-size:0.85rem;color:var(--text2)">
          ระบบจำกัดการส่งเพื่อป้องกันการส่งซ้ำเกินไป
        </div>
      </div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button></div>
    `);
    return;
  }

  // ตรวจสอบช่วงเวลาซ้ำ — อุปกรณ์เดียวกัน ช่วงเวลาทับกัน สถานะ รออนุมัติ/อนุมัติ
  const newStart = new Date(start);
  const newEnd   = new Date(end);
  const conflict = state.requests.find(r => {
    const rEq     = r.equipment || '';
    const rStatus = r.status    || '';
    if (rEq !== eq) return false;
    if (rStatus === 'คืนแล้ว' || rStatus === 'ปฏิเสธ') return false;
    const rStart = new Date(r.startdate || r.startDate || '');
    const rEnd   = new Date(r.enddate   || r.endDate   || '');
    if (isNaN(rStart) || isNaN(rEnd)) return false;
    // ทับกันถ้า newStart < rEnd && newEnd > rStart
    return newStart < rEnd && newEnd > rStart;
  });

  if (conflict) {
    const cs = fmtDT(conflict.startdate || conflict.startDate || '');
    const ce = fmtDT(conflict.enddate   || conflict.endDate   || '');
    openModal('⚠️ อุปกรณ์ถูกจองแล้ว', `
      <div style="margin-bottom:16px">
        <p style="margin-bottom:10px">อุปกรณ์ <strong>${eq}</strong> ถูกจองในช่วงเวลาที่เลือกแล้ว:</p>
        <div style="background:#fff8e1;border:1.5px solid #ffd54f;border-radius:8px;padding:12px">
          <div style="font-weight:600">👤 ${conflict.requester||'-'} (${conflict.dept||'-'})</div>
          <div style="font-size:0.85rem;margin-top:4px;color:var(--text2)">
            📅 ${cs} → ${ce}
          </div>
          <div style="margin-top:6px">${statusBadge(conflict.status||'-')}</div>
        </div>
        <p style="margin-top:12px;font-size:0.88rem;color:var(--text2)">กรุณาเลือกอุปกรณ์อื่น หรือเปลี่ยนช่วงเวลายืม</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">ปิด</button>
      </div>
    `);
    return;
  }

  const ms        = newEnd - newStart;
  const totalMins = Math.floor(ms / 60000);
  const days      = Math.floor(totalMins / 1440);
  const hours     = Math.floor((totalMins % 1440) / 60);

  const res = await gasRequest('addRequest', { data: {
    requester: name, dept, equipment: eq,
    startDate: start, endDate: end, days, hours, note
  }});

  if (res.success) {
    showToast('✅ ส่งใบขอยืมสำเร็จ รอการอนุมัติ');
    // push to local state ทันที (lowercase keys เพื่อให้ตรงกับ GAS)
    state.requests.push({
      id: (res.data && res.data.id) || 'REQ-' + Date.now(),
      requester: name, dept, equipment: eq,
      startdate: start, enddate: end,
      days, hours, note, status: 'รออนุมัติ', handledby: ''
    });
    borrowState.dept = null;
    renderBorrow();
  } else {
    showToast('❌ เกิดข้อผิดพลาด: ' + (res.message || 'กรุณาลองใหม่'));
  }
}

function resetBorrowForm() {
  borrowState.dept = null;
  renderBorrow();
}

function renderHistRows(reqs, role) {
  if (!reqs || reqs.length === 0) return `<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--text2)">ไม่มีข้อมูล</td></tr>`;
  return reqs.map(r => {
    const id = r.id||'-';
    const req = r.requester||'-';
    const dept = r.dept||'-';
    const eq = r.equipment||'-';
    const start = r.startdate||r.startDate||'-';
    const end = r.enddate||r.endDate||'-';
    const days = r.days||0;
    const hours = r.hours||0;
    const status = r.status||'-';
    return `
    <tr>
      <td><span class="tag">${id}</span></td>
      <td style="font-weight:500">${req}</td>
      <td>${dept}</td>
      <td>${eq}</td>
      <td style="font-size:0.82rem;white-space:nowrap">${fmtDT(start)}</td>
      <td style="font-size:0.82rem;white-space:nowrap">${fmtDT(end)}</td>
      <td><span class="text-sm">${days?days+'วัน ':''} ${hours?hours+'ชม.':''}</span></td>
      <td>${statusBadge(status)}</td>
      <td><div class="row-actions">
        ${status==='อนุมัติ' && role!=='user' ? `<button class="btn btn-success btn-sm" onclick="markReturned('${id}')">✔ คืนแล้ว</button>` : ''}
        ${status==='รออนุมัติ' ? `<button class="btn btn-warn btn-sm" onclick="editRequest('${id}')">✏️ แก้ไข</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="viewRequest('${id}')" title="รายละเอียด">👁</button>
        <button class="btn btn-ghost btn-sm" onclick="printBorrowSlip('${id}')" title="พิมพ์ใบยืม">🖨️</button>
      </div></td>
    </tr>`;
  }).join('');
}

function filterHistory() {
  const s = document.getElementById('histSearch').value.toLowerCase();
  const st = document.getElementById('histStatus').value;
  const dept = document.getElementById('histDept').value;
  const role = state.user.role;
  let reqs = role === 'user' ? state.requests.filter(r=>(r.requester)===state.user.username) : state.requests;
  if (s) reqs = reqs.filter(r => JSON.stringify(r).toLowerCase().includes(s));
  if (st) reqs = reqs.filter(r => (r.status) === st);
  if (dept) reqs = reqs.filter(r => (r.dept) === dept);
  document.getElementById('histBody').innerHTML = renderHistRows(reqs, role);
}

async function markReturned(id) {
  const res = await gasRequest('updateRequest', { id, data: { status: 'คืนแล้ว', handledBy: state.user.username }});
  if (res.success) {
    const req = state.requests.find(r => String(r.id||'').trim() === String(id).trim());
    if (req) {
      req.status = 'คืนแล้ว';
      const eq = state.equipment.find(e => String(e.name||'') === String(req.equipment||''));
      if (eq) eq.status = 'ว่าง';

    showToast('✅ บันทึกการคืนอุปกรณ์แล้ว');
    renderHistory();
  } else {
    showToast('❌ ' + (res.message || 'บันทึกไม่สำเร็จ'));
  }
}

function renderEqRows(eqs) {
  if (!eqs || eqs.length === 0) return `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text2)">ไม่มีข้อมูลอุปกรณ์</td></tr>`;
  return eqs.map(e=>{
    const id = e.id || '-';
    const name = e.name || e.Name || '-';
    const category = e.category || e.Category || '-';
    const status = e.status || e.Status || 'ว่าง';
    return `
    <tr>
      <td><span class="tag">${id}</span></td>
      <td style="font-weight:500">${name}</td>
      <td>${category}</td>
      <td>${eqStatusBadge(status)}</td>
      <td><div class="row-actions">
        <button class="btn btn-warn btn-sm" onclick="openEditEq('${id}')">✏️ แก้ไข</button>
        <button class="btn btn-danger btn-sm" onclick="deleteEq('${id}')">🗑 ลบ</button>
      </div></td>
    </tr>`;
  }).join('');
}

function filterEq() {
  const s = document.getElementById('eqSearch').value.toLowerCase();
  const cat = document.getElementById('eqCat').value;
  const st = document.getElementById('eqStatus').value;
  let eqs = state.equipment;
  if (s) eqs = eqs.filter(e => ((e.name||'')+(e.category||'')+(e.id||'')).toLowerCase().includes(s));
  if (cat) eqs = eqs.filter(e => (e.category) === cat);
  if (st) eqs = eqs.filter(e => (e.status) === st);
  document.getElementById('eqBody').innerHTML = renderEqRows(eqs);
}

function autoNextId() {

async function saveAddEq() {
  const customId = (document.getElementById('eqIdNew')?.value || '').trim();
  const name     = document.getElementById('eqName').value.trim();
  const cat      = document.getElementById('eqCatNew').value;
  const status   = document.getElementById('eqStatusNew').value;
  if (!customId) { showToast('⚠️ กรุณากรอกรหัสอุปกรณ์'); return; }
  if (!name)     { showToast('⚠️ กรุณากรอกชื่ออุปกรณ์'); return; }
  // ตรวจ ID ซ้ำ
  if (state.equipment.find(e => String(e.id||e.ID||'').trim() === customId)) {
    showToast('⚠️ รหัส ' + customId + ' มีอยู่แล้ว'); return;
  }
  const saveBtn = document.querySelector('#modalBody .btn-primary');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.innerHTML = '<span class="loading-spinner"></span> กำลังบันทึก...'; }

    showToast('✅ เพิ่มอุปกรณ์ ' + customId + ' แล้ว');

    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = '💾 บันทึก'; }
  }
}

async function approveReq(evt) {
  // ใน inline onclick="fn(event)" → currentTarget อาจ null หลัง dispatch ใช้ target แทน
  const clicked = evt.target || evt.currentTarget;
  // ถ้าคลิกที่ child ของปุ่ม (เช่น icon) ให้หา button parent
  const btn = clicked.closest ? clicked.closest('[data-rid]') : clicked;

  const id      = btn ? String(btn.getAttribute('data-rid') || '').trim() : '';
  const safeIdx = btn ? String(btn.getAttribute('data-safe') || '').trim() : '';

  if (!id) {
    // Debug: แสดง keys ทั้งหมดของ request แรก
    if (state.requests.length > 0) {
      console.log('Keys in request[0]:', JSON.stringify(Object.keys(state.requests[0])));
      console.log('request[0]:', JSON.stringify(state.requests[0]));
    }
    showToast('❌ ไม่พบรหัสรายการ');
    return;
  }

  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> กำลังบันทึก...'; }

  try {
    const res = await gasRequest('updateRequest', {
      id,
      data: { status: 'อนุมัติ', handledBy: state.user.username }
    });

    if (res.success) {
      const r = state.requests.find(x => String(x.id || '').trim() === id);
      if (r) { r.status = 'อนุมัติ'; r.handledby = state.user.username; }
      updateNavBadge();
      showToast('✅ อนุมัติการยืมแล้ว');

      const card = safeIdx ? document.getElementById(safeIdx) : null;
      if (card) {
        card.style.borderColor = 'var(--success)';
        card.style.background  = '#f0fdf4';
        setTimeout(() => {
          card.style.opacity   = '0';
          card.style.transform = 'translateY(-8px)';
          setTimeout(() => _renderApproveBody(), 360);
        }, 300);
      } else {
        _renderApproveBody();
      }
    } else {
      if (btn) { btn.disabled = false; btn.innerHTML = '✅ อนุมัติ'; }
      showToast('❌ ' + (res.message || 'บันทึกไม่สำเร็จ'));
    }
  } catch (err) {
    if (btn) { btn.disabled = false; btn.innerHTML = '✅ อนุมัติ'; }
    showToast('❌ เกิดข้อผิดพลาด: ' + (err.message || String(err)));
  }
}

async function changePassword() {
  const current = document.getElementById('pwCurrent').value;
  const newPw   = document.getElementById('pwNew').value;
  const confirm = document.getElementById('pwConfirm').value;

  if (!current || !newPw || !confirm) { showToast('⚠️ กรุณากรอกข้อมูลให้ครบ'); return; }
  if (newPw !== confirm)              { showToast('⚠️ รหัสผ่านใหม่ไม่ตรงกัน'); return; }
  if (newPw.length < 4)              { showToast('⚠️ รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร'); return; }
  if (newPw === current)             { showToast('⚠️ รหัสผ่านใหม่ต้องไม่ซ้ำกับเดิม'); return; }

  // ตรวจสอบรหัสผ่านปัจจุบันกับ GAS
  const btn = document.getElementById('changePwBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span> กำลังตรวจสอบ...'; }

  const verify = await gasRequest('login', { username: state.user.username, password: current });
  if (!verify.success) {
    showToast('❌ รหัสผ่านปัจจุบันไม่ถูกต้อง');
    if (btn) { btn.disabled = false; btn.innerHTML = '🔑 เปลี่ยนรหัสผ่าน'; }
    return;
  }

  // เปลี่ยนรหัสผ่านผ่าน GAS
  if (btn) btn.innerHTML = '<span class="loading-spinner"></span> กำลังบันทึก...';
  const res = await gasRequest('changePassword', {
    username: state.user.username,
    newPassword: newPw
  });

  if (res.success) {
    showToast('✅ เปลี่ยนรหัสผ่านสำเร็จ');
    document.getElementById('pwCurrent').value = '';
    document.getElementById('pwNew').value     = '';
    document.getElementById('pwConfirm').value = '';
    document.getElementById('pwStrength').style.display = 'none';
  } else {
    showToast('❌ ' + (res.message || 'เกิดข้อผิดพลาด'));
  }
  if (btn) { btn.disabled = false; btn.innerHTML = '🔑 เปลี่ยนรหัสผ่าน'; }
}

    <div style="background:var(--bg);border-radius:8px;padding:9px 12px;margin-bottom:14px;font-size:0.8rem;color:var(--text2)">
      🆔 ${r.id} — แก้ไขได้เฉพาะรายการที่ยังรออนุมัติ
    </div>
    <div class="form-group">
      <label>💻 อุปกรณ์</label>
      <div id="editEqWrap" style="position:relative"></div>
      <input type="hidden" id="editEqHidden" value="${r.equipment||''}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>📅 วันเวลายืม</label>
        <input type="datetime-local" id="editStart" value="${startVal}" onchange="calcEditDuration()" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-family:Sarabun,sans-serif;font-size:0.9rem;background:var(--input-bg);color:var(--text)">
      </div>
      <div class="form-group">
        <label>📅 วันเวลาคืน</label>
        <input type="datetime-local" id="editEnd" value="${endVal}" onchange="calcEditDuration()" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-family:Sarabun,sans-serif;font-size:0.9rem;background:var(--input-bg);color:var(--text)">
      </div>
    </div>
    <div id="editDur" style="background:#f0f7ff;border:1.5px solid #b3d4f5;border-radius:8px;padding:9px 14px;margin-bottom:12px;font-size:0.85rem;color:var(--primary)">⏱ กำลังคำนวณ...</div>
    <div class="form-group">
      <label>📝 หมายเหตุ</label>
      <textarea id="editNote" rows="2" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-family:Sarabun,sans-serif;font-size:0.9rem;background:var(--input-bg);color:var(--text)">${r.note||''}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveEditRequest('${id}')">💾 บันทึก</button>
    </div>
  `);
  setTimeout(() => {
    buildEquipmentAutocomplete('editEqWrap', 'editEqHidden', r.equipment||'');
    calcEditDuration();
  }, 60);
}

function calcEditDuration() {
  const s  = document.getElementById('editStart')?.value;
  const e  = document.getElementById('editEnd')?.value;
  const el = document.getElementById('editDur');
  if (!s || !e || !el) return;
  const ms = new Date(e) - new Date(s);
  if (ms <= 0) { el.textContent='⚠️ วันที่คืนต้องหลังวันที่ยืม'; el.style.color='var(--danger)'; return; }
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000), m = Math.floor((ms%3600000)/60000);
  el.textContent = '⏱ ' + [d?d+'วัน':'', h?h+'ชม.':'', m?m+'นาที':''].filter(Boolean).join(' ') || 'น้อยกว่า 1 นาที';
  el.style.color = 'var(--primary)';
}

async function saveEditRequest(id) {
  const eq    = document.getElementById('editEqHidden')?.value || '';
  const start = document.getElementById('editStart')?.value;
  const end   = document.getElementById('editEnd')?.value;
  const note  = document.getElementById('editNote')?.value.trim() || '';
  if (!eq || !start || !end) { showToast('⚠️ กรุณากรอกข้อมูลให้ครบ'); return; }
  if (new Date(end) <= new Date(start)) { showToast('⚠️ วันที่คืนต้องหลังวันที่ยืม'); return; }
  const ms = new Date(end)-new Date(start);
  const days = Math.floor(ms/86400000), hours = Math.floor((ms%86400000)/3600000);
  const saveBtn = document.querySelector('#modalBody .btn-primary');
  if (saveBtn) { saveBtn.disabled=true; saveBtn.innerHTML='<span class="loading-spinner"></span> กำลังบันทึก...'; }
  const res = await gasRequest('editRequest', { id, data:{equipment:eq, startDate:start, endDate:end, days, hours, note}});
  if (res.success) {
    const r = state.requests.find(x=>String(x.id||'').trim()===id);
    if (r) { r.equipment=eq; r.startdate=start; r.enddate=end; r.days=days; r.hours=hours; r.note=note; }
    showToast('✅ แก้ไขใบขอยืมแล้ว'); closeModal(); renderHistory();
  } else {
    showToast('❌ '+(res.message||'เกิดข้อผิดพลาด'));
    if (saveBtn) { saveBtn.disabled=false; saveBtn.innerHTML='💾 บันทึก'; }
  }
}

// ==================== EXPORT CSV / EXCEL ====================
function getExportRows() {
  const h = ['รหัส','ผู้ยืม','แผนก','อุปกรณ์','วันเวลายืม','วันเวลาคืน','วัน','ชม.','สถานะ','อนุมัติโดย','หมายเหตุ'];
  const r = state.requests.map(r => [
    r.id||'', r.requester||'', r.dept||'', r.equipment||'',
    r.startdate||r.startDate||'', r.enddate||r.endDate||'',
    r.days||0, r.hours||0, r.status||'', r.handledby||r.handledBy||'', r.note||''
  ]);
  return {h,r};
}
function exportCSV() {
  const {h,r} = getExportRows();
  const esc = v => '"'+String(v).replace(/"/g,'""')+'"';
  const csv  = '\uFEFF'+[h,...r].map(row=>row.map(esc).join(',')).join('\r\n');
  const a    = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),
    download: 'IT-Loan-'+new Date().toISOString().slice(0,10)+'.csv'
  });
  a.click(); URL.revokeObjectURL(a.href);
  showToast('📥 Export CSV สำเร็จ');
}
function exportExcel() {
  const {h,r} = getExportRows();
  const esc = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const cell = (v,bold) => '<Cell'+(bold?' ss:StyleID="h"':'')+'><Data ss:Type="String">'+esc(v)+'</Data></Cell>';
  const xml = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<?mso-application progid="Excel.Sheet"?>',
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">',
    '<Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#1a237e" ss:Pattern="Solid"/></Style></Styles>',
    '<Worksheet ss:Name="IT Loan Report"><Table>',
    '<Row>'+h.map(v=>cell(v,true)).join('')+'</Row>',
    ...r.map(row=>'<Row>'+row.map(v=>cell(v,false)).join('')+'</Row>'),
    '</Table></Worksheet></Workbook>'].join('\n');
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'})),
    download: 'IT-Loan-'+new Date().toISOString().slice(0,10)+'.xls'
  });
  a.click(); URL.revokeObjectURL(a.href);
  showToast('📊 Export Excel สำเร็จ');
}

let _pollInterval = null;

  stopPolling();
  _pollInterval = setInterval(async () => {
    if (!state.user) { stopPolling(); return; }
    try {
      const res = await gasRequest('getRequests');
      if (res.success) {
        state.requests = res.data || state.requests;
        updateNavBadge();
        const el = document.querySelector('.stat-card.s4 .stat-val');

      }

  }, 5*60*1000);
}
function stopPolling() { if(_pollInterval){clearInterval(_pollInterval);_pollInterval=null;} }

// ==================== AUTOCOMPLETE EQUIPMENT ====================
function injectACStyle() {
  if (document.getElementById('acCSS')) return;
  const s = document.createElement('style'); s.id='acCSS';
  s.textContent = '.ac-wrap{position:relative}.ac-inp{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:Sarabun,sans-serif;font-size:0.95rem;background:var(--input-bg);color:var(--text);transition:border .2s,box-shadow .2s}.ac-inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,188,212,.15)}.ac-dd{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--card);border:1.5px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);z-index:300;max-height:220px;overflow-y:auto;display:none}.ac-it{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-size:0.88rem;transition:background .1s}.ac-it:last-child{border-bottom:none}.ac-it:hover,.ac-it.sel{background:var(--bg)}.ac-badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px}.ac-ok{background:#e8f5e9;color:#2e7d32}.ac-no{background:#fff8e1;color:#f57f17}.ac-nil{padding:14px;text-align:center;color:var(--text2);font-size:.85rem}';
  document.head.appendChild(s);
}

function buildEquipmentAutocomplete(wrapId, hiddenId, initVal) {
  injectACStyle();
  const wrap = document.getElementById(wrapId);
  if (!wrap) { console.warn('AC: wrap not found:', wrapId); return; }
  const uid = wrapId.replace(/[^a-zA-Z0-9]/g, '');
  wrap.className = 'ac-wrap';
  wrap.innerHTML = [
    '<input type="text" id="ac_'+uid+'" class="ac-inp"',
    ' placeholder="พิมพ์หรือคลิกเพื่อดูรายการอุปกรณ์..." value="'+(initVal||'')+'" autocomplete="off">',
    '<div class="ac-dd" id="add_'+uid+'"></div>',
  ].join('');
  const inp = document.getElementById('ac_'+uid);
  const dd  = document.getElementById('add_'+uid);
  const hid = document.getElementById(hiddenId);
  if (!inp || !dd) { console.warn('AC: elements missing for', wrapId); return; }

  function renderList(q) {
    const query    = (q||'').toLowerCase().trim();
    const allEq    = state.equipment || [];
    const filtered = allEq.filter(e => !query || (e.name||e.Name||'').toLowerCase().includes(query));
    if (allEq.length === 0) {
      dd.innerHTML = '<div class="ac-nil">⚠️ ไม่มีข้อมูลอุปกรณ์ กรุณาไปหน้าจัดการอุปกรณ์ก่อน</div>';
      dd.style.display = ''; return;
    }
    if (filtered.length === 0) {
      dd.innerHTML = '<div class="ac-nil">ไม่พบอุปกรณ์ที่ตรงกัน</div>';
      dd.style.display = ''; return;
    }
    dd.innerHTML = filtered.map(e => {
      const name   = e.name   || e.Name   || '';
      const status = e.status || e.Status || 'ว่าง';
      const cat    = e.category || e.Category || '';
      const isOk   = status === 'ว่าง';
      const safe   = name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return '<div class="ac-it" onclick="acPick(\''+uid+'\',' + "'" + hiddenId + "'" + ',\''+safe+'\')">'
           + '<span>'+name+(cat?' <span style="color:var(--text2);font-size:.73rem">('+cat+')</span>':'')+'</span>'
           + '<span class="ac-badge '+(isOk?'ac-ok':'ac-no')+'">'+status+'</span></div>';
    }).join('');
    dd.style.display = '';
  }

  inp.addEventListener('input',  () => { renderList(inp.value); if (hid) hid.value = ''; });
  inp.addEventListener('focus',  () => renderList(inp.value));
  inp.addEventListener('keydown', ev => {
    const its = [...dd.querySelectorAll('.ac-it')], cur = dd.querySelector('.sel'), ci = its.indexOf(cur);
    if (ev.key === 'ArrowDown') { ev.preventDefault(); const ni=Math.min(ci+1,its.length-1); its.forEach((x,i)=>x.classList.toggle('sel',i===ni)); its[ni]?.scrollIntoView({block:'nearest'}); }
    if (ev.key === 'ArrowUp')   { ev.preventDefault(); const ni=Math.max(ci-1,0);            its.forEach((x,i)=>x.classList.toggle('sel',i===ni)); its[ni]?.scrollIntoView({block:'nearest'}); }
    if (ev.key === 'Enter' && cur) { ev.preventDefault(); cur.click(); }
    if (ev.key === 'Escape') dd.style.display = 'none';
  });
  document.addEventListener('click', ev => { if (!wrap.contains(ev.target)) dd.style.display='none'; }, true);
  if (initVal && hid) hid.value = initVal;
}

function acPick(uid, hiddenId, name) {
  const inp = document.getElementById('ac_'+uid);
  const hid = document.getElementById(hiddenId);
  const dd  = document.getElementById('add_'+uid);
  if(inp) inp.value=name;
  if(hid) hid.value=name;
  if(dd)  dd.style.display='none';
}

function statusBadge(s) {
  const map = {
    'รออนุมัติ': 'badge-warn',
    'อนุมัติ': 'badge-success',
    'คืนแล้ว': 'badge-gray',
    'ปฏิเสธ': 'badge-danger',
  };
  return `<span class="badge ${map[s]||'badge-info'}">${s}</span>`;
}

function eqStatusBadge(s) {
  if (s === 'ว่าง') return `<span class="badge badge-success">✅ ว่าง</span>`;
  if (s === 'ถูกยืม') return `<span class="badge badge-warn">📤 ถูกยืม</span>`;
  return `<span class="badge badge-danger">🔧 ${s}</span>`;
}

function roleBadge(r) {
  if (r === 'admin') return `<span class="badge badge-danger">👑 Admin</span>`;
  if (r === 'it') return `<span class="badge badge-accent">💻 IT</span>`;
  return `<span class="badge badge-info">👤 User</span>`;
}

// ==================== TOAST ====================
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);

// ==================== DARK MODE ====================
function toggleDark() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  setTheme(isDark ? 'light' : 'dark');
}
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  // Update meta theme-color
  const metaColor = document.getElementById('themeColorMeta');
  if (metaColor) metaColor.content = theme === 'dark' ? '#0f1117' : '#1a237e';
}
function initTheme() {
  const saved = localStorage.getItem('theme');
  // ถ้าไม่มีค่า ดู system preference
  if (saved) { setTheme(saved); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(prefersDark ? 'dark' : 'light');
}
// ฟัง system theme change
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('theme')) setTheme(e.matches ? 'dark' : 'light');
  });
}

// ==================== MOBILE SIDEBAR ====================
function toggleSidebar() {
  const sb  = document.getElementById('sidebar');
  const ovl = document.getElementById('sidebarOverlay');
  if (!sb) return;
  const isOpen = sb.classList.contains('open');
  isOpen ? closeSidebar() : openSidebar();
}
function openSidebar() {
  const sb  = document.getElementById('sidebar');
  const ovl = document.getElementById('sidebarOverlay');
  if (sb)  sb.classList.add('open');
  if (ovl) ovl.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  const sb  = document.getElementById('sidebar');
  const ovl = document.getElementById('sidebarOverlay');
  if (sb)  sb.classList.remove('open');
  if (ovl) ovl.classList.remove('open');
  document.body.style.overflow = '';
}
// ปิด sidebar เมื่อ navigate บน mobile
// (closeSidebar ถูกเรียกใน navigate() ด้านล่างแล้ว)
// ปิด sidebar เมื่อ resize กลับเป็น desktop
window.addEventListener('resize', () => {
  if (window.innerWidth > 768) closeSidebar();
});

// ==================== PWA ====================
let _deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'flex';
  console.log('PWA: beforeinstallprompt fired ✅');
});

window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'none';
  _deferredInstallPrompt = null;
  showToast('✅ ติดตั้ง App สำเร็จ!');
});

async function installPWA() {
  if (!_deferredInstallPrompt) {
    showToast('ℹ️ เปิดใน Chrome/Edge แล้วลองใหม่ หรือเพิ่มเข้าหน้าจอหลักจากเมนูบราวเซอร์');
    return;
  }
  _deferredInstallPrompt.prompt();
  const { outcome } = await _deferredInstallPrompt.userChoice;
  if (outcome === 'accepted') showToast('✅ กำลังติดตั้ง...');
  _deferredInstallPrompt = null;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'none';
}

// ==================== INIT ====================
window.addEventListener('DOMContentLoaded', () => {
  initTheme();
  injectManifest();
  updateGasStatusBar();
  // Service Worker สำหรับ PWA offline
  if ('serviceWorker' in navigator) {
    // ใช้ data URL ไม่ได้สำหรับ SW — ต้องสร้าง SW จาก Blob แล้วลง Origin
    // แต่ GitHub Pages อนุญาต blob SW ใน same-origin context
    const swCode = [
      "const CACHE='it-loan-v2';",
      "const SHELL=[];",
      "self.addEventListener('install',e=>{ self.skipWaiting(); });",
      "self.addEventListener('activate',e=>{ e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(n=>n!==CACHE).map(n=>caches.delete(n))))); self.clients.claim(); });",
      "self.addEventListener('fetch',e=>{ if(e.request.method!=='GET'||e.request.url.includes('script.google.com'))return;",
      "e.respondWith(fetch(e.request).then(r=>{ const c=r.clone(); caches.open(CACHE).then(ca=>ca.put(e.request,c)); return r; }).catch(()=>caches.match(e.request))); });",
    ].join('\n');
    try {
      const swBlob = new Blob([swCode], { type: 'text/javascript' });
      const swUrl  = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).then(reg => {
        console.log('SW registered ✅', reg.scope);
      }).catch(err => {
        console.log('SW registration failed (ok on file://):', err.message);
      });
    } catch(e) {
      console.log('SW not supported:', e.message);
    }
  }
});
